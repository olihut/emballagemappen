.btn.sm{height:32px;padding:0 14px;font-size:13.5px}

/* ========= Handlinger ========= */
function vaelgVare(nr){ state.ui.valgt = nr; state.ui.page = 'vare'; render(); window.scrollTo(0,0); }
function indlaesTestdata(){
  const txt = document.getElementById('testdata-csv').textContent;
  const r = importKombineret(txt, { defaultKilde:'testdata' });
  state.varer = r.varer; state.import = null; state.ui.kilde = 'testdata (indlejret)';
  logg(`Indlæste testdata: ${r.varer.length} varer, ${r.antalRaekker} komponentrækker`); gem(); render(); toast(`${r.varer.length} varer indlæst`);
}
function haandterCSV(navn, text){
  const parsed = parseCSV(text);
  const H = parsed.headers.map(norm);
  if (H.includes('komponent') && H.some(h => h.startsWith('vaegt') || h === 'gram')){
    const r = importKombineret(text, { defaultKilde:'ukendt' });
    if (r.fejl){ state.import = { fejl:r.fejl, headers:parsed.headers }; render(); return; }
    const nye = r.varer.filter(v => !state.varer.some(x => x.varenummer === v.varenummer)).length;
    for (const v of r.varer){ const i = state.varer.findIndex(x => x.varenummer === v.varenummer); if (i>=0) state.varer[i] = v; else state.varer.push(v); }
    state.import = null; state.ui.kilde = navn; logg(`Importerede emballagetabel ${navn}: ${r.varer.length} varer (${nye} nye)`); gem(); render(); toast(`${r.varer.length} varer importeret`); return;
  }
  const m = detectSalg(parsed.headers);
  /* Importér direkte kun når varenummer, antal og periode (dato eller kvartalskolonner) er genkendt. Ellers spørger vi. */
  const klar = !!(m.nr && (m.q || (m.antal && m.dato)));
  state.import = { navn, headers:parsed.headers, rows:parsed.rows, auto:{ nr:m.nr, antal: m.antal || (m.q ? 'kvartalskolonner' : null) },
    mapping:{ nr:m.nr, antal:m.antal, navn:m.navn, q:m.q, periode: m.dato ? 'col:' + m.dato : null }, trin: klar ? 'klar' : 'mapping' };
  if (klar) anvendImport(); else render();
}
function anvendImport(){
  const imp = state.import, mp = imp.mapping, per0 = mp.periode || '';
  const m = { nr:mp.nr, antal:mp.antal, navn:mp.navn, q:mp.q || null, dato: per0.startsWith('col:') ? per0.slice(4) : null };
  const kvartal = per0.startsWith('q:') ? Number(per0.slice(2)) : undefined;
  const r = anvendSalg(state.varer, imp.rows, m, { aar:state.aar, kvartal });
  const per = r.kvartaler.map(q => 'Q' + (q + 1)).join(', ');
  const flertal = (n, en, flere) => `${n} ${n === 1 ? en : flere}`;
  const skip = [r.andetAar ? `${flertal(r.andetAar, 'række', 'rækker')} fra et andet år end ${state.aar} er sprunget over.` : '', r.udenDato ? `${flertal(r.udenDato, 'række', 'rækker')} uden gyldig dato er sprunget over.` : ''].filter(Boolean).join(' ');
  logg(`Importerede salgseksport ${imp.navn}: ${r.kendte.length} varer opdateret${per ? ` (${per} ${state.aar})` : ''}, ${r.ukendte.length} ukendte varenumre${skip ? '. ' + skip : ''}`);
  state.ui.kilde = imp.navn;
  if (r.ukendte.length){ imp.trin = 'ukendte'; imp.kendte = r.kendte; imp.ukendte = r.ukendte; imp.resultat = { per, skip }; }
  else { state.import = null; toast(`${r.kendte.length} varer opdateret${per ? ` · ${per} ${state.aar}` : ''}${skip ? ' · ' + skip : ''}`); }
  gem(); render();
}
/* Hostet på claude.ai: filen gives via downloads-capability (viewer bekræfter). Lokal fil: almindelig browser-download. */
let dlNs; async function downloadsNs(){ if (dlNs !== undefined) return dlNs; try { dlNs = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; } catch(e){ dlNs = null; } return dlNs; }
async function download(navn, indhold, type){
  const dl = await downloadsNs();
  if (dl){ try { await dl.save({ filename: navn, data: indhold }); toast(`${navn} er gemt`); } catch(e){ toast(e && e.code === 'declined' ? 'Download afbrudt' : 'Kunne ikke gemme filen her – brug "Kopiér som tekst"'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([indhold], { type })); a.download = navn; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(`Henter ${navn} – hvis intet sker, brug "Kopiér som tekst"`); } catch(e){ toast('Download blokeret her – brug "Kopiér som tekst"'); }
}
async function kopier(txt, ok){ try { await navigator.clipboard.writeText(txt); toast(ok); } catch(e){ const pre = document.getElementById('csv-preview'); if (pre){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Markeret – tryk Ctrl/Cmd+C for at kopiere'); } }
let toastT; function toast(msg){ let t = document.getElementById('toast'); if (!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

  else if (a === 'anvend-mapping'){ state.import.mapping.q = null; anvendImport(); }
  else if (a === 'eksempel-salg'){ const nr = btn.dataset.nr, el = document.getElementById('eksempel-salg-' + nr); if (!el) return; if (!state.varer.length) indlaesTestdata(); state.ui.page = 'varer'; haandterCSV(nr === '1' ? 'salgseksport-kassesystem.csv' : 'salgseksport-ukendte-kolonner.csv', el.textContent.trim()); window.scrollTo(0,0); }
  else if (a === 'opret-nye'){ for (const u of state.import.ukendte) state.varer.push({ varenummer:u.varenummer, varenavn:u.varenavn, varekategori:'', leverandoer:'', leverandoerLand:'', privateLabel:false, producentansvar:'uafklaret', begrundelse:'', solgt:u.solgt, komponenter:[], sidstAendret:null }); logg(`Oprettede ${state.import.ukendte.length} varer fra salgseksport uden emballagedata`); state.import = null; gem(); render(); }
  else if (a === 'tilfoej-komp' && v){ v.komponenter.push({ id:nyId(), navn:'Ny komponent', emballagetype:'primaer', materiale:'Pap', detalje:'', gram:0, antalPrSalgsenhed:1, type:'husholdning', kilde:'estimat', dato:'', miljoegraduering:'ukendt' }); v.sidstAendret = new Date().toISOString(); logg(`${v.varenummer}: tilføjede komponent`); gem(); render(); const inp = document.querySelector('tbody tr:last-child input[data-felt="navn"]'); if (inp){ inp.focus(); inp.select(); } }
  else if (a === 'fjern-komp' && v){ const k = v.komponenter.find(x => x.id === btn.dataset.id); v.komponenter = v.komponenter.filter(x => x.id !== btn.dataset.id); v.sidstAendret = new Date().toISOString(); logg(`${v.varenummer}: fjernede komponent "${k ? k.navn : ''}"`); gem(); render(); }
  else if (a === 'download-csv') download(filnavn(), eksportCSV(res, state.ordning, state.ui.format), 'text/csv;charset=utf-8');
  else if (a === 'kopier-csv') kopier(eksportCSV(res, state.ordning, state.ui.format).replace('﻿',''), 'Eksportfilen er kopieret');
  else if (a === 'download-doc') download(`hotel-test-as_vareliste_${state.aar}.csv`, dokumentationCSV(state.varer, res), 'text/csv;charset=utf-8');
  else if (a === 'eksport-backup') download(`emballagemappen_sikkerhedskopi_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({ version:'v0', eksporteret:new Date().toISOString(), ordning:state.ordning, aar:state.aar, varer:state.varer, log:state.log }, null, 2), 'application/json');
  else if (a === 'nulstil'){ if (!state.ui.bekraeftNulstil){ state.ui.bekraeftNulstil = true; render(); return; } state.varer = []; state.log = []; state.import = null; state.ui.bekraeftNulstil = false; state.ui.kilde = null; try { localStorage.removeItem(KEY); } catch(e){} render(); toast('Mappen er nulstillet'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'soeg'){ state.ui.soeg = t.value; const main = document.getElementById('main'); const pos = t.selectionStart; main.innerHTML = visVarer(beregn(state.varer)); const s = document.getElementById('soeg'); s.focus(); s.setSelectionRange(pos,pos); return; }
  const v = state.varer.find(x => x.varenummer === state.ui.valgt); if (!v) return;
  const tr = t.closest('tr[data-komp]');
  if (tr && t.dataset.felt){ const k = v.komponenter.find(x => x.id === tr.dataset.komp); if (!k) return; const f = t.dataset.felt; k[f] = (f === 'gram' || f === 'antalPrSalgsenhed') ? (toNumber(t.value) || 0) : t.value; liveCalc(v); }
  else if (t.dataset.vq !== undefined){ v.solgt[Number(t.dataset.vq)] = toNumber(t.value) || 0; liveCalc(v); }
  else if (t.dataset.vfelt && t.type !== 'radio'){ v[t.dataset.vfelt] = t.value; }
});
document.addEventListener('focusin', e => { if (e.target.matches('input,select,textarea')) e.target.dataset.orig = e.target.value; });
function liveCalc(v){ const b = beregnVare(v), s = solgtTotal(v); const c = document.getElementById('calc'); if (c) c.innerHTML = visCalc(v, b, s, erProducent(v)); const f = document.getElementById('komp-foot'); if (f) f.innerHTML = `<div>${v.komponenter.length} komponenter</div><div>Emballage pr. stk. <b style="color:var(--text)">${kg(b.gramPrStk)} g</b></div>`; }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ui){ const k = t.dataset.ui; if (k === 'ordning'){ state.ordning = t.value; logg(`Skiftede ordning til ${ORDNINGER[t.value]}`); gem(); } else if (k === 'kunMangler') state.ui.kunMangler = t.checked; else state.ui[k] = t.value; render(); return; }
  if (t.dataset.map){ state.import.mapping[t.dataset.map] = t.value || null; render(); return; }
  const v = state.varer.find(x => x.varenummer === state.ui.valgt); if (!v) return;
  const tr = t.closest('tr[data-komp]');
  const orig = t.dataset.orig;
  if (tr && t.dataset.felt){ const k = v.komponenter.find(x => x.id === tr.dataset.komp); if (!k) return; const f = t.dataset.felt; const tal = (f === 'gram' || f === 'antalPrSalgsenhed'); k[f] = tal ? (toNumber(t.value) || 0) : t.value; const before = orig === undefined ? '' : (tal ? String(toNumber(orig) || 0) : orig); const after = String(k[f]); if (before !== after) logg(`${v.varenummer}: ${k.navn} · ${f} ${tal ? before.replace('.',',') : (before || '–')} → ${tal ? after.replace('.',',') : after}`); }
  else if (t.dataset.vq !== undefined){ v.solgt[Number(t.dataset.vq)] = toNumber(t.value) || 0; logg(`${v.varenummer}: solgt Q${Number(t.dataset.vq)+1} → ${v.solgt[Number(t.dataset.vq)]}`); }
  else if (t.dataset.vfelt){ const f = t.dataset.vfelt; const before = t.type === 'radio' ? v[f] : orig; v[f] = t.value; if (f === 'producentansvar') logg(`${v.varenummer}: producentansvar ${PA_KORT[before]||before} → ${PA_KORT[t.value]}`); else if (f === 'begrundelse') logg(`${v.varenummer}: begrundelse opdateret`); else if (String(before) !== String(t.value)) logg(`${v.varenummer}: ${f} ændret`); }
  else return;
  t.dataset.orig = t.value; v.sidstAendret = new Date().toISOString(); gem(); render();
});
document.getElementById('file-csv').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => haandterCSV(f.name, r.result); r.readAsText(f, 'utf-8'); e.target.value = ''; });
document.getElementById('file-json').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const s = JSON.parse(r.result); if (!Array.isArray(s.varer)) throw new Error('Ikke en sikkerhedskopi'); state.varer = s.varer; state.log = s.log || []; state.ordning = s.ordning || 'vana'; state.aar = s.aar || 2026; logg(`Indlæste sikkerhedskopi ${f.name}`); gem(); render(); toast(`${s.varer.length} varer indlæst fra sikkerhedskopi`); } catch(err){ toast('Filen er ikke en gyldig sikkerhedskopi'); } }; r.readAsText(f, 'utf-8'); e.target.value = ''; });
document.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest('#drop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => haandterCSV(f.name, r.result); r.readAsText(f, 'utf-8'); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('tr.row')) vaelgVare(e.target.dataset.open); });

hent();
const hash = location.hash.replace('#','');
if (['varer','beregning','test'].includes(hash)) state.ui.page = hash;
render();
})();
</script>
